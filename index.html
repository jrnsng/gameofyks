<!DOCTYPE html>
<html lang="tr">

<head>
    <meta name="theme-color" content="#240b36">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Game of YKS">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3426/3426231.png">
    <link rel="icon" href="icon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <style>
        :root {
            --bg-color: #0d0221;
            --panel-color: #240b36;
            --gain-color: #4dfd63;
            --lose-color: #ff3838;
            --border: 4px solid #000;
        }

        * {
            touch-action: manipulation;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: #fff;
            font-family: 'Press Start 2P', cursive;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            image-rendering: pixelated;
        }

        #header {
            position: sticky;
            top: 0;
            width: 100%;
            z-index: 1000;
            background: var(--panel-color);
            border: var(--border);
            padding: 15px 10px;
            box-shadow: 0 5px 0 #000;
            margin-bottom: 20px;
        }

        #rank-text {
            font-size: 10px;
            color: #ffd700;
            margin-bottom: 8px;
            text-align: center;
        }

        #xp-text {
            font-size: 14px;
            text-align: center;
            margin-bottom: 10px;
        }

        #xp-bar-bg {
            width: 100%;
            height: 20px;
            background: #000;
            border: 2px solid #fff;
            overflow: hidden;
        }

        #xp-bar-fill {
            height: 100%;
            background: var(--gain-color);
            width: 0%;
            transition: width 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .main-content {
            width: 100%;
            max-width: 500px;
        }

        .section {
            background: var(--panel-color);
            border: var(--border);
            padding: 15px;
            margin-bottom: 25px;
            box-shadow: 6px 6px 0px #000;
        }

        h2 {
            font-size: 12px;
            text-align: center;
            margin-bottom: 15px;
            border-bottom: 2px solid #fff;
            padding-bottom: 10px;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
            font-size: 10px;
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border: 2px dashed #444;
        }

        select {
            padding: 12px;
            font-family: 'Press Start 2P';
            font-size: 9px;
            background: #000;
            color: #fff;
            border: 2px solid #fff;
            width: 100%;
        }

        .btn-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        button {
            font-family: 'Press Start 2P', cursive;
            font-size: 10px;
            padding: 20px 10px;
            border: var(--border);
            color: white;
            cursor: pointer;
            text-shadow: 2px 2px 0px #000;
            box-shadow: 4px 4px 0px #000;
            transition: 0.1s;
        }

        button:active {
            transform: translate(4px, 4px);
            box-shadow: 0px 0px 0px #000;
        }

        .gain-btn {
            background: #2d5a27;
        }

        .spend-btn {
            background: #8b0000;
        }

        .reset-btn {
            background: #444;
            margin-top: 10px;
        }

        .floating-text {
            position: fixed;
            top: 45%;
            left: 50%;
            font-size: 32px;
            z-index: 2000;
            pointer-events: none;
            white-space: nowrap;
            text-shadow: 6px 6px 0px #000;
            /* Donanım hızlandırmayı zorla */
            will-change: transform, opacity;
            transform: translate3d(-50%, 0, 0);
            animation: floatUp 0.8s ease-out forwards;
        }

        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .xp-needed {
            font-size: 8px;
            color: #aaa;
            text-align: right;
            margin-bottom: 5px;
        }

        .unlocked {
            color: var(--gain-color) !important;
            font-weight: bold;
        }

        @keyframes floatUp {
            0% {
                opacity: 0;
                transform: translate3d(-50%, 40px, 0) scale(0.6);
            }

            20% {
                opacity: 1;
                transform: translate3d(-50%, 0, 0) scale(1.2);
            }

            100% {
                opacity: 0;
                transform: translate3d(-50%, -120px, 0) scale(1);
            }
        }

        .meteor {
            position: absolute;
            width: 40px;
            height: 40px;
            background: radial-gradient(circle, #ffeb3b, #ff9800, #f44336);
            border-radius: 50% 50% 50% 10%;
            z-index: 1500;
            animation: fall 0.5s ease-in forwards;
        }

        @keyframes fall {
            0% {
                transform: translateY(-400px) rotate(-45deg) scale(0.5);
                opacity: 1;
            }

            100% {
                transform: translateY(0) rotate(-45deg) scale(1.5);
                opacity: 0;
            }
        }

        .shake {
            animation: shake 0.2s cubic-bezier(.36, .07, .19, .97) both;
            transform: translate3d(0, 0, 0);
            backface-visibility: hidden;
        }

        @keyframes shake {

            10%,
            90% {
                transform: translate3d(-1px, 0, 0);
            }

            20%,
            80% {
                transform: translate3d(2px, 0, 0);
            }

            30%,
            50%,
            70% {
                transform: translate3d(-4px, 0, 0);
            }

            40%,
            60% {
                transform: translate3d(4px, 0, 0);
            }
        }

        .daily-challenge {
            background: linear-gradient(45deg, #4b0082, #240b36);
            border: 4px double #ffd700 !important;
            padding: 15px;
            margin-bottom: 25px;
            position: relative;
            overflow: hidden;
        }

        .daily-title {
            color: #ffd700;
            font-size: 10px;
            margin-bottom: 10px;
            display: block;
            text-shadow: 2px 2px 0px #000;
        }

        #daily-desc {
            font-size: 9px;
            line-height: 1.5;
            margin-bottom: 15px;
            display: block;
        }

        .complete-btn {
            background: #ffd700;
            color: #000;
            width: 100%;
            text-shadow: none;
            font-weight: bold;
        }

        .complete-btn:disabled {
            background: #444;
            color: #888;
            cursor: not-allowed;
        }

        .chest-section {
            background: #1a0530;
            border: var(--border);
            padding: 15px;
            margin-top: 25px;
            box-shadow: 6px 6px 0px #000;
        }

        .item-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-top: 15px;
        }

        .item-slot {
            aspect-ratio: 1/1;
            background: #000;
            border: 2px solid #444;
            display: flex;
            flex-direction: column;
            /* İsim ve emoji alt alta */
            align-items: center;
            justify-content: center;
            font-size: 16px;
            position: relative;
            padding: 5px;
            text-align: center;
        }

        .item-name {
            font-size: 7px;
            /* İsimler çok küçük ama okunur olacak */
            color: #aaa;
            margin-top: 4px;
            text-transform: uppercase;
        }

        .item-slot.earned .item-name {
            color: #ffd700;
        }

        .item-slot.earned {
            border-color: #ffd700;
            background: radial-gradient(circle, #240b36, #000);
        }

        .rarity-legend {
            font-size: 8px;
            display: flex;
            justify-content: space-around;
            margin-top: 10px;
            color: #aaa;
        }

        /* Nadirlik Çerçeveleri */
        .item-slot.common {
            border-color: #ffffff;
        }

        /* Yaygın - Beyaz */
        .item-slot.rare {
            border-color: #3498db;
            box-shadow: 0 0 10px #3498db;
        }

        /* Nadir - Mavi */
        .item-slot.legendary {
            border-color: #ffd700;
            box-shadow: 0 0 15px #ffd700;
            animation: glow 1.5s infinite alternate;
        }

        /* Efsanevi - Altın */

        @keyframes glow {
            from {
                box-shadow: 0 0 5px #ffd700;
            }

            to {
                box-shadow: 0 0 20px #ffd700;
            }
        }
    </style>
</head>

        function updateChestUI() {
            const grid = document.getElementById('item-grid');
            if (!grid) return;
            grid.innerHTML = '';

            items.forEach(item => {
                const isEarned = myItems.includes(item.id);
                const slot = document.createElement('div');

                // Eşya kazanıldıysa nadirlik sınıfını ekle, kazanılmadıysa standart bırak
                slot.className = `item-slot ${isEarned ? 'earned ' + item.rarity : ''}`;

                let raritySymbol = "";
                if (item.rarity === 'legendary') raritySymbol = "✨";
                else if (item.rarity === 'rare') raritySymbol = "🔹";
                else raritySymbol = "⚪";

                slot.innerHTML = `
            <div>${isEarned ? item.emoji : '❓'}</div>
            <div class="item-name">${isEarned ? raritySymbol + " " + item.name : 'KİLİTLİ'}</div>
        `;
                grid.appendChild(slot);
            });
        }

        // Görev tamamlandığında çağrılacak fonksiyon (Önceki completeDailyChallenge içine ekle)
        function dropItem() {
            const unearnedItems = items.filter(i => !myItems.includes(i.id));
            if (unearnedItems.length > 0) {
                const randomItem = unearnedItems[Math.floor(Math.random() * unearnedItems.length)];
                myItems.push(randomItem.id);
                localStorage.setItem('my_items', JSON.stringify(myItems));
                alert(`TEBRİKLER! Görevi tamamladın ve bir eşya kazandın: ${randomItem.emoji} ${randomItem.name}`);
                updateChestUI();
            }
        }

        let currentDaily = null;

        function setupDailyMission() {
            const today = new Date().toDateString();
            const savedDate = localStorage.getItem('daily_date');
            const isCompleted = localStorage.getItem('daily_completed') === today;
            const btn = document.getElementById('daily-complete-btn'); // Butonu tanımladık
            let xp = parseInt(localStorage.getItem('study_xp')) || 0;
            let myItems = JSON.parse(localStorage.getItem('my_items')) || [];

            if (savedDate !== today) {
                const randomIndex = Math.floor(Math.random() * dailyMissions.length);
                currentDaily = dailyMissions[randomIndex];
                localStorage.setItem('daily_mission', JSON.stringify(currentDaily));
                localStorage.setItem('daily_date', today);
                localStorage.removeItem('daily_completed');

                // Yeni görev geldiğinde butonu aç ve yazısını düzelt
                btn.disabled = false;
                btn.innerText = "GÖREVİ YAPTIM";
            } else {
                currentDaily = JSON.parse(localStorage.getItem('daily_mission'));
            }

            document.getElementById('daily-desc').innerText = currentDaily.text + ` (+${currentDaily.xp} XP)`;

            if (isCompleted) {
                btn.disabled = true;
                btn.innerText = "TAMAMLANDI!";
            }
        }

        function completeDailyChallenge() {
            const today = new Date().toDateString();
            if (localStorage.getItem('daily_completed') === today) return;

            xp += currentDaily.xp;
            localStorage.setItem('daily_completed', today);

            const btn = document.getElementById('daily-complete-btn');
            btn.disabled = true;
            btn.innerText = "TAMAMLANDI!";

            // Eşya düşürme fonksiyonunu burada çağırıyoruz
            dropItem();

            playSound('gain');
            triggerMeteor(btn);

            setTimeout(() => {
                showFloatingText(currentDaily.xp);
                updateUI();
            }, 500);
        }

        // updateUI fonksiyonunun en sonuna setupDailyMission(); eklemeyi unutma veya script sonunda çağır:
        setupDailyMission();

        // SES MOTORU
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'gain') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(440, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.2);
            } else {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(200, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.2);
            }
        }

        function showFloatingText(amount) {
            const oldTexts = document.querySelectorAll('.floating-text');
            oldTexts.forEach(t => t.remove());

            const el = document.createElement('div');
            el.className = 'floating-text';
            el.innerText = amount > 0 ? `+${amount} XP` : `${amount} XP`;
            el.style.color = amount > 0 ? 'var(--gain-color)' : 'var(--lose-color)';
            document.body.appendChild(el);

            // Bellek yönetimi için 800ms sonra kaldır (animasyon süresiyle uyumlu)
            setTimeout(() => el.remove(), 800);
        }

        function triggerMeteor(btn) {
            const rect = btn.getBoundingClientRect();
            const m = document.createElement('div');
            m.className = 'meteor';
            m.style.left = (rect.left + rect.width / 2 - 20) + 'px';
            m.style.top = (rect.top + window.scrollY - 20) + 'px';
            document.body.appendChild(m);

            setTimeout(() => {
                m.remove();
                document.body.classList.add('shake');
                if (window.navigator.vibrate) window.navigator.vibrate([50, 30, 50]);
                setTimeout(() => document.body.classList.remove('shake'), 300);
            }, 450);
        }

        function handleXP(amount, btn) {
            let finalAmount = amount;
            const isFull = document.getElementById('isFull').checked;
            const lesson = document.getElementById('lesson').value;

            if (amount > 0) {
                // Çarpan Kontrolü
                if (isFull && lesson === 'diger' && amount !== 500) {
                    finalAmount = amount * 2;
                }
                xp += finalAmount;
                playSound('gain');
            } else {
                if (xp + amount < 0) {
                    alert("Yeterli XP birikmedi!");
                    return;
                }
                xp += amount;
                playSound('spend');
            }

            triggerMeteor(btn);
            setTimeout(() => {
                showFloatingText(finalAmount);
                updateUI();
            }, 500);
        }

        function resetDay(btn) {
            const REQUIRED_XP = 250;

            if (xp < REQUIRED_XP) {
                playSound('spend');
                alert(`Günü bitirmek için henüz yeterli enerjin yok! \nEn az ${REQUIRED_XP} XP toplamalısın. \nŞu anki XP: ${xp}`);
                return;
            }

            if (confirm("Harika bir iş çıkardın! 250 XP harcayarak günü bitirmek üzeresin. Emin misin?")) {
                triggerMeteor(btn);
                xp = 0;

                // --- GÖREV YENİLEME MANTIĞI BURADA ---
                localStorage.removeItem('daily_date'); // Tarihi siliyoruz ki yeni görev tetiklensin
                localStorage.removeItem('daily_completed'); // Tamamlanma durumunu siliyoruz
                // -------------------------------------

                playSound('spend');
                setTimeout(() => {
                    showFloatingText(-250);
                    setupDailyMission(); // Yeni görevi anında ekrana getirir
                    updateUI();
                }, 500);
            }
        }

        function updateUI() {
            document.getElementById('xp-val').innerText = xp;
            localStorage.setItem('study_xp', xp);
            const rankText = document.getElementById('rank-text');
            let currentRank = "";
            if (xp < 50) currentRank = "TOZLU KİTAPLIK";
            else if (xp < 150) currentRank = "KALEM ÜSTADI";
            else if (xp < 350) currentRank = "DENEME MUHAFIZI";
            else if (xp < 700) currentRank = "SINAV CANAVARI";
            else currentRank = "ÖSYM";
            rankText.innerText = "RÜTBE: " + currentRank;
            let fill = (xp / 7000) * 1000;
            document.getElementById('xp-bar-fill').style.width = Math.min(fill, 100) + "%";
            const shopItems = [
                { id: 'info-70-1', cost: 70 },
                { id: 'info-70-2', cost: 70 },
                { id: 'info-70-3', cost: 70 },
                { id: 'info-100', cost: 100 },
                { id: 'info-140', cost: 140 },
                { id: 'info-250', cost: 250 }
            ];
            shopItems.forEach(item => {
                const el = document.getElementById(item.id);
                if (xp >= item.cost) {
                    el.innerText = "SATIN ALINABİLİR!";
                    el.classList.add('unlocked');
                } else {
                    const diff = item.cost - xp;
                    el.innerText = `${diff} XP DAHA GEREKLİ`;
                    el.classList.remove('unlocked');
                }
            });

            document.getElementById('xp-val').innerText = xp;
            localStorage.setItem('study_xp', xp);
            updateChestUI();

        }

        updateUI();
        updateChestUI();
    </script>
</body>
